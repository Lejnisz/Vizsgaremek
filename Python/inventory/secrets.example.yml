# Másold secrets.yml néven és töltsd ki. A secrets.yml NEM kerülhet verziókezelésbe (.gitignore).
# Éles környezetben minden érték legyen egyedi, hosszú és eszközönként/telephelyenként rotált.
admin_user: admin
admin_password: CHANGE_ME          # SSH felhasználó jelszó (IOS + ASA)
enable_secret: CHANGE_ME           # enable secret (IOS) / enable password (ASA)
ipsec_psk: CHANGE_ME               # ISAKMP előre megosztott kulcs (GRE/IPsec alagutak)
chap_password: CHANGE_ME           # PPP CHAP közös jelszó
remote_vpn:
  group_key: CHANGE_ME             # Easy VPN csoportkulcs
  user: vpnuser
  password: CHANGE_ME
wifi:
  staff_psk: CHANGE_ME             # nem konfigban él (AP-n), a dokumentáció használja
  guest_psk: CHANGE_ME
